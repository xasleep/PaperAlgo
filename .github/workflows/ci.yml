name: CI

on:
  pull_request:
    branches:
      - PaperAlgo
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - PaperAlgo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-windows:
    name: ci-windows
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      CI: "true"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\pip-cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-runtime.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Python CI dependencies
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}\pip-cache
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile Python sources
        run: |
          $env:PYTHONPYCACHEPREFIX = Join-Path `
            $env:RUNNER_TEMP `
            "paper2code-pycache"
          python -m compileall -q codes web_api tests

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.1"
          package-manager-cache: false

      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('web_ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install WebUI dependencies
        working-directory: web_ui
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: npm.cmd ci

      - name: Typecheck WebUI
        working-directory: web_ui
        run: npm.cmd run typecheck

      - name: Build WebUI
        working-directory: web_ui
        run: npm.cmd run build

      - name: Verify same-origin bundle
        working-directory: web_ui
        run: npm.cmd run verify:same-origin

      - name: Run Python tests
        run: |
          $pytestBase = Join-Path `
            $env:RUNNER_TEMP `
            ("paper2code-pytest-" + [guid]::NewGuid().ToString("N"))
          python -m pytest tests -q -rs `
            -p no:cacheprovider `
            --basetemp $pytestBase

      - name: Run WebUI development smoke
        working-directory: web_ui
        run: npm.cmd run smoke

      - name: Run production integration smoke
        working-directory: web_ui
        run: npm.cmd run smoke:prod

      - name: Run fake-provider Playwright E2E
        working-directory: web_ui
        run: npm.cmd run e2e:fake
